# Manually triggered: CI, then bump the version and publish to npm (or a dry run).
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# One-time setup on npm (package settings -> Trusted Publisher -> GitHub Actions):
#   owner/repo: cminn10/pi-keepwarm, workflow file: release.yml
# or from the CLI (npm >= 11.15, 2FA required):
#   npm trust github pi-keepwarm --file release.yml --repo cminn10/pi-keepwarm --allow-publish
#
# The publish job runs in the `npm` environment, so each release shows up under the
# repository's Deployments with a link to the published version on npmjs.com.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = publish the version already in package.json)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      dry_run:
        description: "Dry run: CI + npm publish --dry-run, no commit, tag, or publish"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack --dry-run

  dry-run:
    needs: ci
    if: inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bump version (not committed)
        if: inputs.bump != 'none'
        run: npm version "${{ inputs.bump }}" --no-git-tag-version
      - name: Check the version is not published yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm. Choose a bump other than 'none'."
            exit 1
          fi
          echo "Would release $name@$version"
      - run: npm publish --dry-run

  publish:
    needs: ci
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: ${{ steps.version.outputs.url }}
    permissions:
      contents: write # push the version commit and tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Bump version
        if: inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "Release v%s"

      - name: Check the version is not published yet
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          {
            echo "name=$name"
            echo "version=$version"
            echo "url=https://www.npmjs.com/package/$name/v/$version"
          } >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm. Choose a bump other than 'none'."
            exit 1
          fi
          echo "Releasing $name@$version"

      - name: Push version commit and tag
        if: inputs.bump != 'none'
        run: git push --follow-tags

      - name: Publish to npm
        run: npm publish --access public

      # npm scans new versions for malware before they become installable (~5-15 min).
      - name: Wait until the version is on the registry
        run: |
          spec="${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
          for _ in $(seq 1 60); do
            if npm view "$spec" version --prefer-online >/dev/null 2>&1; then
              echo "$spec is available"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::$spec was accepted but is not visible on the registry after 30 minutes (npm publish-time malware scan still pending or held for review)"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --target "$(git rev-parse HEAD)" --generate-notes
          fi
